# enable bluetooth
CONFIG_BT=y

# use the default Bluetooth transmit power (0 dBm)
# If the split halves have connection issues, try:
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# sleep after 10 minutes of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# "Eager Debouncing"
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# display disabled (keyboard has no display)
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
CONFIG_NICE_VIEW_GEM_ANIMATION=n
